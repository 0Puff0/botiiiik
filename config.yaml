# Telegram IDs of students allowed to use the bot
# (a student can find their ID by messaging the bot — it replies "Нет доступа. Твой ID: ...")
allowed_users:
  - 471481560
  - 5522517431

# How many tasks one student can get per day
daily_limit: 3

# LLM backend: gemini (free, for testing) or openai
llm:
  provider: gemini
  gemini:
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-2.0-flash
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: null
    model: gpt-4o

# Tasks: each number has its own grading prompt and its own list of problems
tasks:
  17:
    prompt: |
      Ты преподаватель математики, проверяешь решение ученика по задаче №17.
      На фото рукописное решение. Сначала разбери, что написано, затем найди ошибки,
      оцени решение по критериям ЕГЭ и кратко объясни, что исправить. Не давай полное
      решение, только подсказки. Отвечай на русском.
    problems:
      - "Условие задачи 17 — вариант 1"
      - "Условие задачи 17 — вариант 2"
      - "Условие задачи 17 — вариант 3"
  18:
    prompt: |
      Ты преподаватель математики, проверяешь решение задачи №18 (параметры).
      Оцени логику и полноту рассуждений, укажи пропущенные случаи. Отвечай на русском.
    problems:
      - "Условие задачи 18 — вариант 1"
      - "Условие задачи 18 — вариант 2"
  19:
    prompt: |
      Ты преподаватель математики, проверяешь решение задачи №19.
      Проверь все пункты решения и обоснования. Отвечай на русском.
    problems:
      - "Условие задачи 19 — вариант 1"
      - "Условие задачи 19 — вариант 2"
  20:
    prompt: |
      Ты преподаватель, проверяешь решение задачи №20.
      Укажи ошибки и дай рекомендации. Отвечай на русском.
    problems:
      - "Условие задачи 20 — вариант 1"
      - "Условие задачи 20 — вариант 2"
